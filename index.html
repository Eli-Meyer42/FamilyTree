<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050406">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Family Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8b76a;--gold2:#f3dc9c;--bronze:#8a6d3b;--panel:rgba(15,11,8,.96);--line:#4f3f25;--text:#ece2cb;--muted:#a3957a;--danger:#c4584a;--top:calc(env(safe-area-inset-top) + 60px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050406;color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;display:flex;align-items:center;gap:7px;background:linear-gradient(#050406f0,#05040600);pointer-events:none}
.top>*{pointer-events:auto}
.sp{flex:1}
.crest{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px;font-family:Cinzel,serif;font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--gold2);text-shadow:0 0 12px #d8b76a55;min-width:0}
.crest span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.crest-mark{color:var(--gold);font-size:14px}
.ibtn{position:relative;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid #5d4a2a;background:radial-gradient(circle at 50% 35%,#2b2115,#0c0907 70%);color:var(--gold);display:grid;place-items:center;box-shadow:inset 0 0 0 2px #0a0806,inset 0 0 0 3px #3a2d1a,0 2px 10px #000b;padding:0}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:20px;height:20px}
.ibtn .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#ff9a4a;box-shadow:0 0 8px #ff9a4a;display:none}
.zoom{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:4;display:flex;flex-direction:column;gap:8px}
#mini{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:4;width:150px;height:104px;border-radius:10px;border:1px solid #5d4a2a;background:#0b0907d9;box-shadow:inset 0 0 0 2px #0a0806,inset 0 0 0 3px #3a2d1a55,0 4px 14px #000a;touch-action:none;display:none}
body.sheet-open.mobile .zoom,body.sheet-open.mobile #mini,body.sheet-open .badge{display:none!important}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:64vh;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--panel);border-top:1px solid #7a6136;box-shadow:0 -12px 40px #000d,inset 0 1px 0 #c9a55a33;border-radius:18px 18px 0 0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.sheet:before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:#5d4a2a;margin:0 auto 10px}
@media(min-width:820px){.sheet{left:auto;top:calc(env(safe-area-inset-top) + 64px);right:12px;bottom:12px;width:360px;max-height:none;border-radius:14px;border:1px solid #7a6136;transform:translateX(112%)}.sheet.open{transform:none}.sheet:before{display:none}}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head h2{flex:1;margin:0;font-family:Cinzel,serif;font-weight:700;font-size:22px;color:var(--gold2);letter-spacing:.03em;line-height:1.2}
.x{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:2px 6px}
.orn{height:10px;margin:8px 0 10px;background:linear-gradient(90deg,transparent,#8a6d3b,transparent) center/100% 1px no-repeat;position:relative}
.orn:after{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-size:9px;color:var(--gold);background:#0f0b08;padding:0 6px}
.rel{display:inline-flex;gap:6px;align-items:center;margin-top:6px;padding:4px 10px;border-radius:999px;border:1px solid #6b5530;background:#1d160d;color:var(--gold2);font-size:13px}
.rel small{color:var(--muted)}
.facts{display:grid;gap:7px;margin:4px 0 6px}
.fact{display:flex;gap:10px;font-size:14px;line-height:1.35}
.fact b{flex:none;width:76px;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fact .soon{color:#ffb36b}
.he{font-family:serif;direction:rtl;unicode-bidi:isolate;color:var(--muted)}
.sec{font-family:Cinzel,serif;font-size:12px;letter-spacing:.12em;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #4f3f25;background:#17110b;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--text)}
.chip i{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:12px;border:1px solid #5d4a2a;background:linear-gradient(#21180e,#120d08);font-size:11.5px;color:var(--text)}
.act span{font-family:Cinzel,serif;font-size:18px;color:var(--gold);line-height:1}
.act:disabled{opacity:.35}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid #7a6136;background:linear-gradient(#3a2b16,#1d150b);color:var(--gold2);font-family:Cinzel,serif;font-weight:600;font-size:13.5px;letter-spacing:.04em;box-shadow:inset 0 1px 0 #f3dc9c22}
.btn.ghost{background:#120d08;border-color:#4f3f25;color:var(--text)}
.btn.danger{border-color:#7a3a30;background:linear-gradient(#3a1812,#1d0c09);color:#f0b2a6}
.btn:disabled{opacity:.4}
.hint{color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:8px}
.list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.li{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;background:none;border:0;text-align:left;width:100%}
.li:active,.li:hover{background:#1c150c}
.li .d{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:Cinzel,serif;font-size:12px;font-weight:700;color:var(--gold2);border:2px solid #8a6d3b;background:#120d08}
.li .m{flex:1;min-width:0}
.li .m div:first-child{font-weight:500}
.li .m div:last-child{font-size:12px;color:var(--muted)}
.li .r{font-size:12px;color:var(--gold);text-align:right;white-space:nowrap}
.li .r.today{color:#ffb36b;font-weight:600}
input,select,textarea{width:100%;padding:10px 11px;border-radius:9px;border:1px solid #4f3f25;background:#0c0906;color:var(--text);font:inherit;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#a8873f}
input[type=checkbox]{width:auto;accent-color:#c9a55a}
label.f{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid #4f3f25;border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;background:#0c0906;border:0;color:var(--muted);font-size:13.5px}
.seg button.on{background:linear-gradient(#3a2b16,#1d150b);color:var(--gold2)}
.ck{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.modal{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.open{display:flex}
.dlg{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid #7a6136;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 50px #000}
@media(min-width:620px){.modal{align-items:center}.dlg{border-radius:16px}}
.dlg h3{margin:0 0 4px;font-family:Cinzel,serif;color:var(--gold2);font-size:19px}
.empty,.loading{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.empty.on,.loading.on{display:flex}
.card{pointer-events:auto;max-width:360px;text-align:center;background:#0f0b08e6;border:1px solid #7a6136;border-radius:16px;padding:22px 20px;box-shadow:0 10px 50px #000}
.card h2{font-family:Cinzel,serif;color:var(--gold2);margin:0 0 6px;font-size:22px}
.card p{color:var(--muted);margin:0 0 14px;line-height:1.45}
.loading .card{pointer-events:none;font-family:Cinzel,serif;color:var(--gold);letter-spacing:.08em}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 96px);transform:translate(-50%,-8px);z-index:30;background:#1a130b;border:1px solid #7a6136;color:var(--gold2);padding:8px 14px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.badge{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 62px);z-index:3;font-size:11.5px;color:var(--muted);background:#0b0907cc;border:1px solid #3a2d1a;padding:4px 10px;border-radius:999px;display:none;pointer-events:none}
.syncrow{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted);padding:2px 2px 4px}
.syncdot{width:9px;height:9px;border-radius:50%;flex:none;background:#6b6355}
.syncdot.live{background:#4fb07a;box-shadow:0 0 8px #4fb07a}.syncdot.saving{background:#d6b24a}.syncdot.error{background:#c4584a}.syncdot.offline{background:#8a7a5a}
.buildstamp{text-align:center;font-size:12px;color:#6f6553;margin:22px 0 2px}
textarea{min-height:140px;font-size:12px;font-family:ui-monospace,monospace}
.hebname{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:21px;color:var(--gold);letter-spacing:0;margin-top:2px;text-align:left;unicode-bidi:isolate}
.nick{font-family:Inter,sans-serif;font-weight:400;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:2px}
.dt{display:grid;grid-template-columns:1.5fr 1fr 1.1fr;gap:6px}
.dt select,.dt input{padding:10px 8px}
.mid{display:flex;gap:6px;margin-top:6px}
.mid button{flex:none;width:42px;border-radius:9px;border:1px solid #4f3f25;background:#120d08;color:var(--muted);font-size:20px}
.addmid{margin-top:8px;background:none;border:1px dashed #6b5530;border-radius:9px;color:var(--gold);padding:8px 12px;font-size:13.5px;width:100%;text-align:left}
</style>
</head>
<body>
<canvas id="c"></canvas>

<header class="top">
  <button class="crest" id="crestBtn" aria-label="Menu"><span class="crest-mark">✦</span><span id="famName">Our Family</span></button>
  <div class="sp"></div>
  <button class="ibtn" id="modeBtn" title="Switch layout" aria-label="Switch layout"></button>
  <button class="ibtn" id="searchBtn" title="Find someone" aria-label="Find someone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
  <button class="ibtn" id="bdayBtn" title="Birthdays" aria-label="Birthdays"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M5 20v-7h14v7M5 16c2 1.2 4.5 1.2 7 0s5-1.2 7 0M12 13V9M12 6.5c-.9-.9-.9-2 0-3 .9 1 .9 2.1 0 3z"/></svg><span class="dot" id="bdayDot"></span></button>
  <button class="ibtn" id="menuBtn" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
</header>

<div class="zoom">
  <button class="ibtn" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
  <button class="ibtn" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
  <button class="ibtn" id="zfit" aria-label="Fit everyone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<canvas id="mini"></canvas>

<aside class="sheet" id="sheet"><div id="sheetBody"></div></aside>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>

<div class="empty" id="empty"><div class="card" id="emptyCard"></div></div>
<div class="loading on" id="loading"><div class="card">Opening the archive…</div></div>
<div class="toast" id="toast"></div>
<div class="badge" id="badge"></div>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-database-compat.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, SP=108, UGAP=44, ROW=200, RING=165, NR=25, KR=33;
const PALETTE=[[214,78,62],[72,176,108],[74,128,214],[176,108,220],[224,162,58],[62,182,188],[216,98,152],[152,178,72]];
const NEUTRAL=[150,128,92];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];
const S={people:new Map(),meId:null,familyName:'Our Family',sel:null,hover:null,mode:'radial',trans:null,storage:'loading',readOnly:false,sheet:null,bdayCal:'en'};
let K={gen:new Map(),kids:new Map(),par:new Map(),tree:new Map(),radial:new Map(),groups:new Map(),pairs:[],color:new Map(),maxG:0,R0:170,hl:{nodes:new Set(),edges:new Set()},soon:new Set(),bd:new Map()};
const cam={x:0,y:0,s:.6}; let camAnim=null;
const cv=$('#c'),ctx=cv.getContext('2d'),mini=$('#mini'),mctx=mini.getContext('2d');
let vw=0,vh=0,dpr=1,bg=null,raf=null;
const DB={sample:null};

/* ---------- utils ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const has=id=>S.people.has(id);
const P_=id=>S.people.get(id);
const fullName=p=>p?[p.first,...(p.middle||[]),p.last].filter(Boolean).join(' ')||'Unnamed':'';
const shortName=p=>p?(p.nick||p.first||p.hebName||'Unnamed'):'';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const initials=p=>((p.first||'?')[0]+((p.last||'')[0]||'')).toUpperCase();
const word=(g,m,f,n)=>g==='m'?m:g==='f'?f:n;
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const isMobile=()=>innerWidth<820;
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms)}

/* ---------- dates ---------- */
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function parseD(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);if(!y||!m||!d)return null;return new Date(y,m-1,d)}
function nextBday(b){const t=today0();const mk=yy=>{let d=new Date(yy,b.getMonth(),b.getDate());if(d.getMonth()!==b.getMonth())d=new Date(yy,b.getMonth()+1,0);return d};let n=mk(t.getFullYear());if(n<t)n=mk(t.getFullYear()+1);return{date:n,days:Math.round((n-t)/864e5),turns:n.getFullYear()-b.getFullYear()}}
function ageAt(b,at){let a=at.getFullYear()-b.getFullYear();if(at.getMonth()<b.getMonth()||(at.getMonth()===b.getMonth()&&at.getDate()<b.getDate()))a--;return a}
const fmtD=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtMD=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const inDays=n=>n===0?'today':n===1?'tomorrow':`in ${n} days`;
const HEB=(()=>{try{const f=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});if(f.resolvedOptions().calendar!=='hebrew')return null;return{f,he:new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'})}}catch(e){return null}})();
function hebParts(d){const o={};for(const p of HEB.f.formatToParts(d)){if(p.type==='day')o.day=+p.value;else if(p.type==='month')o.month=p.value;else if(p.type==='year'||p.type==='relatedYear')o.year=+p.value}return o}
let HK=null,HKday='';
function hebKeys(){const t=today0(),k=t.toDateString();if(HK&&HKday===k)return HK;HK=[];for(let i=0;i<400;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);HK.push({d,...hebParts(d)})}HKday=k;return HK}
function monthMatch(bm,m){if(bm===m)return true;if(bm==='Adar')return m==='Adar II';if(bm==='Adar I'||bm==='Adar II')return m==='Adar';return false}
function hebInfo(p){if(!HEB||!p.birth)return null;const b=parseD(p.birth);if(!b)return null;const d=p.afterSunset?new Date(b.getFullYear(),b.getMonth(),b.getDate()+1):b;const hb={...hebParts(d),text:HEB.f.format(d),he:HEB.he.format(d)};
  if(!p.dead)for(const k of hebKeys()){if(k.day===hb.day&&monthMatch(hb.month,k.month)){hb.next={date:k.d,days:Math.round((k.d-today0())/864e5),turns:k.year-hb.year};break}}
  return hb}
function bdInfo(p){const b=parseD(p.birth);if(!b)return null;const o={b};if(p.dead){const d=parseD(p.death);if(d)o.diedAge=ageAt(b,d)}else{o.age=ageAt(b,today0());o.next=nextBday(b)}o.heb=hebInfo(p);return o}

/* ---------- data normalize ---------- */
const okId=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,60}$/.test(v);
function norm(o,id){o=o&&typeof o==='object'?o:{};const s=(v,n)=>typeof v==='string'?v.slice(0,n):'';const arr=v=>Array.isArray(v)?[...new Set(v.filter(okId))]:[];const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'';
  return{id,first:s(o.first,60),middle:Array.isArray(o.middle)?o.middle.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.slice(0,60)).slice(0,6):[],last:s(o.last,60),nick:s(o.nick,60),maiden:s(o.maiden,60),hebName:s(o.hebName,80),gender:['m','f','x'].includes(o.gender)?o.gender:'',birth:date(o.birth),afterSunset:!!o.afterSunset,dead:!!o.dead,death:date(o.death),place:s(o.place,120),notes:s(o.notes,1000),parents:arr(o.parents).filter(x=>x!==id).slice(0,2),partners:arr(o.partners).filter(x=>x!==id).slice(0,12),created:typeof o.created==='number'?o.created:0}}
const clone=p=>JSON.parse(JSON.stringify(p));

/* ---------- graph helpers ---------- */
const parentsOf=id=>(P_(id)?.parents||[]).filter(has);
const partnersOf=id=>[...(K.par.get(id)||[])];
const kidsOf=id=>K.kids.get(id)||[];
function siblingsOf(id){const s=new Set();for(const par of parentsOf(id))for(const k of kidsOf(par))if(k!==id)s.add(k);return[...s]}
function ancestorsDist(id){const m=new Map([[id,0]]),q=[id];while(q.length){const x=q.shift();for(const p of parentsOf(x))if(!m.has(p)){m.set(p,m.get(x)+1);q.push(p)}}return m}
function descendants(id){const s=new Set([id]),q=[id];while(q.length){const x=q.shift();for(const k of kidsOf(x))if(!s.has(k)){s.add(k);q.push(k)}}return s}
function isAncestor(a,b){return a!==b&&ancestorsDist(b).has(a)}

/* ---------- relationship labels ---------- */
const greats=n=>n<=0?'':n===1?'great-':n===2?'great-great-':`${n}× great-`;
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
function bloodLabel(up,down,g,half){
  if(up===0&&down===0)return'you';
  if(down===0)return up===1?word(g,'father','mother','parent'):greats(up-2)+word(g,'grandfather','grandmother','grandparent');
  if(up===0)return down===1?word(g,'son','daughter','child'):greats(down-2)+word(g,'grandson','granddaughter','grandchild');
  if(up===1&&down===1)return(half?'half-':'')+word(g,'brother','sister','sibling');
  if(down===1)return(up===2?'':up===3?'great-':greats(up-3)+'great-')+word(g,'uncle','aunt','aunt/uncle');
  if(up===1)return(down===2?'':down===3?'grand':greats(down-3)+'grand')+word(g,'nephew','niece','niece/nephew');
  const deg=Math.min(up,down)-1,rem=Math.abs(up-down);
  return`${ord(deg)} cousin`+(rem?(rem===1?' once removed':rem===2?' twice removed':` ${rem}× removed`):'');
}
function relRaw(from,to){
  if(from===to)return{label:'you'};
  const t=P_(to),f=P_(from),g=t.gender,b=blood(from,to);
  if(b){let half=false;if(b.up===1&&b.down===1){const fp=parentsOf(from),tp=parentsOf(to);const sh=fp.filter(x=>tp.includes(x)).length;half=sh===1&&(fp.length===2||tp.length===2)}
    let side='';if(b.up>=2){const sides=new Set();for(const par of parentsOf(from)){if(ancestorsDist(par).get(b.ca)===b.up-1){const pg=P_(par).gender;sides.add(pg==='m'?"father’s side":pg==='f'?"mother’s side":'')}}if(sides.size===1)side=[...sides][0]}
    return{label:bloodLabel(b.up,b.down,g,half),side}}
  if(partnersOf(to).includes(from))return{label:word(g,'husband','wife','partner')};
  for(const q of partnersOf(to)){const r=blood(from,q);if(r){if(r.up===0&&r.down===1)return{label:word(g,'son-in-law','daughter-in-law','child-in-law')};if(r.up===1&&r.down===1)return{label:word(g,'brother-in-law','sister-in-law','sibling-in-law')};if(r.up===1&&r.down===0)return{label:word(g,'stepfather','stepmother','step-parent')};return{label:`${bloodLabel(r.up,r.down,P_(q).gender,false)}’s ${word(g,'husband','wife','partner')}`}}}
  for(const q of partnersOf(from)){const r=blood(q,to);if(r){if(r.up===1&&r.down===0)return{label:word(g,'father-in-law','mother-in-law','parent-in-law')};if(r.up===1&&r.down===1)return{label:word(g,'brother-in-law','sister-in-law','sibling-in-law')};if(r.up===0&&r.down===1)return{label:word(g,'stepson','stepdaughter','stepchild')};return{label:`${word(P_(q).gender,'husband','wife','partner')}’s ${bloodLabel(r.up,r.down,g,false)}`}}}
  return null;
}
const meOk=()=>S.meId&&has(S.meId);
function relToMe(id){if(!meOk())return null;const r=relRaw(S.meId,id);return r}

/* ---------- derive layout ---------- */
function derive(){
  const list=[...S.people.values()].sort((a,b)=>(a.created||0)-(b.created||0)||(a.id<b.id?-1:1));
  const kids=new Map(list.map(p=>[p.id,[]])),par=new Map(list.map(p=>[p.id,new Set()]));
  for(const p of list){for(const x of p.parents)if(has(x))kids.get(x).push(p.id);for(const q of p.partners)if(has(q)&&q!==p.id){par.get(p.id).add(q);par.get(q).add(p.id)}}
  // implicit couples: co-parents become partners for layout
  for(const p of list){const ps=p.parents.filter(has);if(ps.length===2){par.get(ps[0]).add(ps[1]);par.get(ps[1]).add(ps[0])}}
  K={...K,kids,par};
  // generations
  const g=new Map(list.map(p=>[p.id,0]));
  for(let it=0;it<80;it++){let ch=false;for(const p of list){let v=g.get(p.id);const ps=p.parents.filter(has);
      if(ps.length)v=Math.max(v,Math.max(...ps.map(x=>g.get(x)))+1);
      else{for(const q of par.get(p.id))v=Math.max(v,g.get(q));for(const c of kids.get(p.id))v=Math.max(v,g.get(c)-1)}
      if(v!==g.get(p.id)){g.set(p.id,Math.min(v,60));ch=true}}if(!ch)break}
  let minG=Infinity,maxG=0;for(const v of g.values()){minG=Math.min(minG,v)}for(const[k,v]of g){g.set(k,v-minG);maxG=Math.max(maxG,v-minG)}
  if(!list.length)maxG=0;

  const seen=new Set(),units=[],unitOf=new Map(),byGen=Array.from({length:maxG+1},()=>[]);
  for(const p of[...list].sort((a,b)=>g.get(a.id)-g.get(b.id))){if(seen.has(p.id))continue;const gg=g.get(p.id),mem=[],q=[p.id];seen.add(p.id);
    while(q.length){const x=q.shift();mem.push(x);for(const y of par.get(x))if(!seen.has(y)&&g.get(y)===gg){seen.add(y);q.push(y)}}
    const u={id:units.length,g:gg,mem:orderChain(mem,par),x:0};units.push(u);mem.forEach(m=>unitOf.set(m,u));byGen[gg].push(u)}
  const X=new Map(),off=(u,i)=>(i-(u.mem.length-1)/2)*SP,width=u=>u.mem.length*SP;
  const setX=u=>u.mem.forEach((m,i)=>X.set(m,u.x+off(u,i)));
  const pack=L=>{let cur=0;L.forEach((u,i)=>{if(i)cur+=(width(L[i-1])+width(u))/2+UGAP;u.x=cur;setX(u)})};
  const parMean=m=>{const ps=P_(m).parents.filter(has);if(!ps.length||ps.some(x=>!X.has(x)))return null;return ps.reduce((s,x)=>s+X.get(x),0)/ps.length};
  const downKey=u=>{let s=0,n=0;u.mem.forEach((m,i)=>{const pm=parMean(m);if(pm!=null){s+=pm-off(u,i);n++}});return n?s/n:null};
  const upKey=u=>{let s=0,n=0;for(const m of u.mem)for(const c of kids.get(m))if(X.has(c)){s+=X.get(c);n++}return n?s/n:null};
  const orient=u=>{if(u.mem.length<2)return;let w=0;u.mem.forEach((m,i)=>{const pm=parMean(m);if(pm!=null)w+=(pm-u.x)*(i-(u.mem.length-1)/2)});if(w<0){u.mem.reverse();setX(u)}};
  const sortL=(L,key)=>{L.forEach((u,i)=>{const k=key(u);u._k=k==null?u.x:k;u._i=i});L.sort((a,b)=>a._k-b._k||a._i-b._i)};
  pack(byGen[0]);
  for(let gi=1;gi<=maxG;gi++){const L=byGen[gi];L.forEach((u,i)=>u.x=1e9+i);sortL(L,downKey);pack(L);L.forEach(orient)}
  for(let it=0;it<4;it++){for(let gi=maxG-1;gi>=0;gi--){sortL(byGen[gi],upKey);pack(byGen[gi])}for(let gi=1;gi<=maxG;gi++){sortL(byGen[gi],downKey);pack(byGen[gi]);byGen[gi].forEach(orient)}}
  // reserve room for each family's descendants so one family's kids never sit under/outside another family
  const childUnitsOf=u=>{const s=new Set();for(const m of u.mem)for(const k of kids.get(m))s.add(unitOf.get(k));return s};
  const blockOf=new Map();
  for(let gi=maxG;gi>=0;gi--){const blocks=[];let cur=null;
    for(const u of byGen[gi]){const cu=childUnitsOf(u);if(cur&&cu.size&&[...cu].some(x=>cur.kids.has(x))){cur.units.push(u);cu.forEach(x=>cur.kids.add(x))}else{cur={units:[u],kids:new Set(cu)};blocks.push(cur)}}
    const claimed=new Set();
    for(const B of blocks){B.own=B.units.reduce((s,u)=>s+width(u),0)+UGAP*(B.units.length-1);const cb=[];
      for(const cu of B.kids){const b=blockOf.get(cu);if(b&&!claimed.has(b)){claimed.add(b);cb.push(b)}}

  const sep=(a,b)=>{const base=(width(a)+width(b))/2+UGAP,A=blockOf.get(a),B=blockOf.get(b);if(!A||A===B)return base;
    return Math.max(base+24,(A.need+B.need)/2+UGAP+24-(A.own-width(a))/2-(B.own-width(b))/2)};
  const place=(L,T)=>{if(!L.length)return;const c=[0];for(let i=1;i<L.length;i++)c[i]=c[i-1]+sep(L[i-1],L[i]);const st=[];

    let i=0;for(const b of st)for(let j=0;j<b.n;j++,i++){L[i].x=b.v+c[i];setX(L[i])}};
  const both=u=>{const a=downKey(u),b=upKey(u);return a!=null&&b!=null?(a+b)/2:a??b??u.x};
  for(let it=0;it<16;it++){for(let gi=0;gi<=maxG;gi++)place(byGen[gi],byGen[gi].map(both));for(let gi=maxG;gi>=0;gi--)place(byGen[gi],byGen[gi].map(both))}
  for(let gi=maxG-1;gi>=0;gi--)place(byGen[gi],byGen[gi].map(u=>upKey(u)??u.x));
  let x0=Infinity,x1=-Infinity;for(const v of X.values()){x0=Math.min(x0,v);x1=Math.max(x1,v)}if(!X.size){x0=x1=0}
  const mid=(x0+x1)/2,span=(x1-x0)+SP*1.2;

  for(let it=0;it<6;it++){if(sc*span<MINFAN)sc=MINFAN/span;if(sc*span>TAU*.94)sc=TAU*.94/span;ringR=[];
    for(let gi=0;gi<=maxG;gi++){const need=isFinite(gapMin[gi])?MINARC/(sc*gapMin[gi]):0;ringR[gi]=Math.max(gi?ringR[gi-1]+RING:R0MIN,need)}
    const ns=1/ringR[maxG];if(Math.abs(ns-sc)<1e-6)break;sc=Math.max(ns,sc*0.85)}
  const R0=ringR[0],fanA0=-Math.PI/2+(x0-mid)*sc,fanA1=-Math.PI/2+(x1-mid)*sc;
  const tree=new Map(),radial=new Map();
  for(const p of list){const x=X.get(p.id),gg=g.get(p.id);tree.set(p.id,{x:x-mid,y:(gg-maxG/2)*ROW});
    const a=-Math.PI/2+(x-mid)*sc,r=ringR[gg];radial.set(p.id,{x:r*Math.cos(a),y:r*Math.sin(a),a,r})}
  // single generation-0 couple/person: pull into a tighter center feel
  const groups=new Map();for(const p of list){const ps=p.parents.filter(has).sort();if(!ps.length)continue;const k=ps.join('|');if(!groups.has(k))groups.set(k,{parents:ps,kids:[]});groups.get(k).kids.push(p.id)}
  const pairs=[];for(const[a,s]of par)for(const b of s)if(a<b)pairs.push([a,b]);
  // household colours: every couple/parent-set is a household; child households get a nearby shade of their parents' hue
  const hsl=(h,s,l)=>{h=(((h%360)+360)%360)/360;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]};
  const ROOTH=[40,208,278,165,345,18,235,95];
  const hh=new Map();const addH=(key,adults)=>{if(!hh.has(key))hh.set(key,{key,adults})};
  for(const[k,gp]of groups)addH(k,gp.parents);for(const[a,b]of pairs)addH(pk(a,b),[a,b]);

  const birthKey=id=>P_(id).parents.filter(has).sort().join('|');
  const HL=[...hh.values()];for(const H of HL){H.g=Math.min(...H.adults.map(a=>g.get(a)));H.x=H.adults.reduce((s,a)=>s+X.get(a),0)/H.adults.length;H.births=[...new Set([...H.adults].sort((a,b)=>X.get(a)-X.get(b)).map(birthKey).filter(k=>k&&hh.has(k)))].slice(0,1)}

    let sx=0,sy=0,ls=0;for(const b of H.births){const B=hh.get(b),sib=kidsOfBirth.get(b),i=sib.indexOf(H),n=sib.length,step=Math.min(55,170/Math.max(1,n));const hue=(B.h+(i-(n-1)/2)*step)*Math.PI/180;sx+=Math.cos(hue);sy+=Math.sin(hue);ls+=B.l+(n>1?(i%2?.09:-.06):0)}

function orderChain(mem,par){if(mem.length<3)return mem;const inU=new Set(mem),deg=id=>[...par.get(id)].filter(x=>inU.has(x)).length;const start=mem.reduce((a,b)=>deg(b)<deg(a)?b:a);const out=[],seen=new Set(),st=[start];while(st.length){const x=st.pop();if(seen.has(x))continue;seen.add(x);out.push(x);for(const y of par.get(x))if(inU.has(y)&&!seen.has(y))st.push(y)}for(const m of mem)if(!seen.has(m))out.push(m);return out}

function computeHL(){const hl={nodes:new Set(),edges:new Set(),mode:null};const sel=S.sel;K.hl=hl;if(!sel||!has(sel))return;
  if(meOk()&&S.meId!==sel){const path=bfsPath(S.meId,sel);if(path){hl.mode='path';path.forEach(id=>hl.nodes.add(id));for(let i=0;i<path.length-1;i++)hl.edges.add(pk(path[i],path[i+1]));return}}
  hl.mode='line';const up=ancestorsDist(sel),down=descendants(sel);
  for(const id of up.keys()){hl.nodes.add(id);for(const p of parentsOf(id))hl.edges.add(pk(id,p))}
  for(const id of down){hl.nodes.add(id);for(const k of kidsOf(id))hl.edges.add(pk(id,k))}
  for(const q of partnersOf(sel)){hl.nodes.add(q);hl.edges.add(pk(sel,q))}
  for(const[a,b]of K.pairs)if(up.has(a)&&up.has(b))hl.edges.add(pk(a,b));
}

function resize(){dpr=Math.min(devicePixelRatio||1,2.5);vw=innerWidth;vh=innerHeight;cv.width=vw*dpr;cv.height=vh*dpr;

function req(){if(!raf)raf=requestAnimationFrame(frame)}
let lastPulse=0;

const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));

const modal=$('#modal'),dlg=$('#dlg');
function openModal(html,sticky=false){dlg.innerHTML=html;modal.classList.add('open');modal.dataset.sticky=sticky?'1':'';dlg.onclick=null;dlg.onchange=null;dlg.scrollTop=0}
function closeModal(){modal.classList.remove('open');dlg.innerHTML='';if(IMP.ctl)IMP.ctl.abort()}
modal.addEventListener('pointerdown',e=>{if(e.target===modal&&!modal.dataset.sticky)closeModal()});
function confirmBox(title,msg,ok,danger){return new Promise(res=>{openModal(`<h3>${esc(title)}</h3><p class="hint" style="font-size:14px">${esc(msg)}</p><div class="row"><button class="btn ghost" data-v="0">Cancel</button><button class="btn ${danger?'danger':''}" data-v="1">${esc(ok)}</button></div>`);
  dlg.onclick=e=>{const b=e.target.closest('[data-v]');if(b){closeModal();res(b.dataset.v==='1')}}})}
function showText(t){openModal(`<h3>Your backup</h3><p class="hint">Select all and copy it somewhere safe.</p><textarea readonly>${esc(t)}</textarea><div class="row"><button class="btn" data-v>Done</button></div>`);dlg.onclick=e=>{if(e.target.closest('[data-v]'))closeModal()};const ta=dlg.querySelector('textarea');ta.focus();ta.select()}
function importDlg(){openModal(`<h3>Restore from backup</h3><p class="hint">Choose a backup file, or paste a backup you copied. People with the same ID are updated; everyone else is kept.</p>
  <label class="addmid" style="display:block;cursor:pointer;margin-top:10px">＋ Choose backup file<input type="file" id="impF" style="display:none"></label>
  <div id="rsMsg" class="hint" style="color:var(--gold2)"></div>
  <label class="f">Or paste it</label><textarea id="impT" placeholder='{"people":[…]}'></textarea><div class="row"><button class="btn ghost" data-v="0">Cancel</button><button class="btn" data-v="1">Restore</button></div>`);
  $('#impF').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();$('#impT').value=t;$('#rsMsg').textContent=/^\s*[\[{]/.test(t)?`Loaded ${f.name} — tap Restore`:`${f.name} doesn’t look like a backup file.`};
  dlg.onclick=async e=>{const b=e.target.closest('[data-v]');if(!b)return;if(b.dataset.v==='0')return closeModal();const msg=t=>{$('#rsMsg').textContent=t};if(S.readOnly)return msg('Unlock editing first: ☰ → Editing → enter the family code.');let d;try{d=JSON.parse($('#impT').value)}catch(err){return msg('That doesn’t look like a backup — choose the .json file or paste its contents.')}
    const arr=Array.isArray(d)?d:Array.isArray(d.people)?d.people:d.people&&typeof d.people==='object'?Object.entries(d.people).map(([id,o])=>({...o,id})):null;if(!arr||!arr.length)return msg('No people found in that backup.');const ch=new Map();for(const o of arr.slice(0,3000))if(o&&okId(o.id))ch.set(o.id,norm(o,o.id));closeModal();
    if(d.familyName&&typeof d.familyName==='string'){S.familyName=d.familyName.slice(0,40)}await commit(ch);log('restore',ch.size+' people');toast(`Restored ${ch.size} people`);fitView()}}

function candidates(rel,anchor){const all=[...S.people.values()].filter(p=>p.id!==anchor);
  if(rel==='child')return all.filter(p=>!isAncestor(p.id,anchor)&&!parentsOf(p.id).includes(anchor)&&parentsOf(p.id).length<2);
  if(rel==='parent')return all.filter(p=>!isAncestor(anchor,p.id)&&!parentsOf(anchor).includes(p.id));
  if(rel==='partner')return all.filter(p=>!partnersOf(anchor).includes(p.id));
  if(rel==='sibling')return all.filter(p=>!parentsOf(p.id).length&&!isAncestor(p.id,anchor)&&!isAncestor(anchor,p.id)&&!(K.kids.get(p.id)||[]).length);
  return[]}
function openForm(cfg){const edit=cfg.kind==='edit',a=cfg.anchor?P_(cfg.anchor):null;
  const p=edit?P_(cfg.id):{first:'',last:(cfg.rel==='child'||cfg.rel==='sibling'||cfg.rel==='parent')&&a?a.last:'',gender:'',birth:'',afterSunset:false,dead:false,death:'',place:'',notes:''};
  const titles={root:'Add a person',child:`Add a child of ${a?.first||''}`,parent:`Add a parent of ${a?.first||''}`,partner:`Add a partner for ${a?.first||''}`,sibling:`Add a sibling of ${a?.first||''}`};
  const cands=edit?[]:candidates(cfg.rel,cfg.anchor);
  let extra='';
  if(!edit&&cfg.rel==='child'){const ps=partnersOf(cfg.anchor);extra=`<label class="f">Other parent</label><select id="fOther">${ps.map(q=>`<option value="${q}">${esc(fullName(P_(q)))}</option>`).join('')}<option value="">Not in the tree / unknown</option></select>`}
  if(!edit&&cfg.rel==='parent'){const ps=parentsOf(cfg.anchor);if(ps.length===1)extra=`<label class="ck"><input type="checkbox" id="fLinkP" checked> Partner of ${esc(fullName(P_(ps[0])))}</label>`}
  const g=p.gender;
  openModal(`<h3>${esc(edit?'Edit '+fullName(p):titles[cfg.rel])}</h3>
   ${!edit&&cands.length?`<div class="seg" style="margin-top:10px"><button type="button" class="on" id="tNew">New person</button><button type="button" id="tEx">Already in tree</button></div>`:''}
   <form id="pf" autocomplete="off">
    <div id="exBox" style="display:none"><label class="f">Choose person</label><select id="fEx">${cands.sort((x,y)=>fullName(x).localeCompare(fullName(y))).map(c=>`<option value="${c.id}">${esc(fullName(c))}</option>`).join('')}</select></div>
    <div id="newBox">
     <label class="f">First name</label><input id="fFirst" value="${esc(p.first)}" maxlength="60">
     <div id="mids">${(p.middle||[]).map(midRow).join('')}</div>
     <button type="button" class="addmid" id="addMid">＋ Middle name</button>
     <div class="two"><div><label class="f">Last name</label><input id="fLast" value="${esc(p.last)}" maxlength="60"></div><div><label class="f">Nickname</label><input id="fNick" value="${esc(p.nick||'')}" maxlength="60" placeholder="Optional"></div></div>
     <label class="f">Maiden name</label><input id="fMaiden" value="${esc(p.maiden||'')}" maxlength="60" placeholder="Optional — last name at birth">
     <label class="f">Hebrew name</label><input id="fHeb" dir="rtl" value="${esc(p.hebName||'')}" maxlength="80" placeholder="Optional — shown in details" style="font-family:'Frank Ruhl Libre',serif;font-size:18px">
     <label class="f">Gender</label><div class="seg" id="fG"><button type="button" data-g="m" class="${g==='m'?'on':''}">Male</button><button type="button" data-g="f" class="${g==='f'?'on':''}">Female</button><button type="button" data-g="x" class="${g==='x'?'on':''}">Other</button></div>
     <label class="f">Birthday</label>${dateField('birth',p.birth)}

     <div id="deathBox" style="display:${p.dead?'block':'none'}"><label class="f">Date of passing</label>${dateField('death',p.death)}</div>

    </div>
    ${extra}
    <div class="row"><button type="button" class="btn ghost" id="fCancel">Cancel</button><button class="btn" type="submit">${edit?'Save':'Add'}</button></div>
   </form>`);
  let gender=g,useEx=false;

  $('#fDead').onchange=e=>$('#deathBox').style.display=e.target.checked?'block':'none';
  bindDates();

  $('#addMid').onclick=()=>{if(mids.children.length>=6)return toast('That’s plenty of middle names');mids.insertAdjacentHTML('beforeend',midRow(''));mids.lastElementChild.querySelector('input').focus()};
  mids.onclick=e=>{const b=e.target.closest('[data-rm]');if(b)b.parentElement.remove()};
  $('#fCancel').onclick=closeModal;
  if($('#tNew')){$('#tNew').onclick=()=>{useEx=false;$('#tNew').classList.add('on');$('#tEx').classList.remove('on');$('#exBox').style.display='none';$('#newBox').style.display='block'};
    $('#tEx').onclick=()=>{useEx=true;$('#tEx').classList.add('on');$('#tNew').classList.remove('on');$('#exBox').style.display='block';$('#newBox').style.display='none'}}
  if(!isMobile())setTimeout(()=>$('#fFirst')?.focus(),30);
  $('#pf').onsubmit=async e=>{e.preventDefault();
    const birth=readDate('birth'),death=$('#fDead').checked?readDate('death'):'';
    const fields={first:$('#fFirst').value.trim(),middle:[...mids.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean),last:$('#fLast').value.trim(),nick:$('#fNick').value.trim(),maiden:$('#fMaiden').value.trim(),hebName:$('#fHeb').value.trim(),gender,birth,afterSunset:!!$('#fSun')?.checked,dead:$('#fDead').checked,death,place:$('#fPlace').value.trim(),notes:$('#fNotes').value.trim()};
    if(!useEx&&!fields.first){$('#fFirst').focus();return toast('Add at least a first name')}
    if(!useEx&&birth===null)return toast('Birthday needs a month, day and 4-digit year');
    if(!useEx&&death===null)return toast('Date of passing needs a month, day and 4-digit year');
    if(edit){const n=norm({...P_(cfg.id),...fields},cfg.id);closeModal();await commit(new Map([[n.id,n]]));return}
    const opts={other:$('#fOther')?.value||'',linkP:$('#fLinkP')?.checked};
    const res=applyAdd(cfg.rel,cfg.anchor,useEx?$('#fEx').value:null,fields,opts);if(res.err)return toast(res.err);
    closeModal();await commit(res.ch);

function midRow(v){return`<div class="mid"><input value="${esc(v)}" maxlength="60" placeholder="Middle name"><button type="button" data-rm aria-label="Remove middle name">×</button></div>`}
function dateField(key,val){const[y,m,d]=(val||'').split('-').map(Number);
  return`<div class="dt" data-dt="${key}"><select class="dm" aria-label="Month"><option value="">Month</option>${MONTHS.map((n,i)=>`<option value="${i+1}" ${m===i+1?'selected':''}>${n}</option>`).join('')}</select>
